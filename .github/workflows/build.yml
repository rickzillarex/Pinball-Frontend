```yaml
name: Build Windows EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install PyQt6 Pillow pyinstaller
      - run: pyinstaller --onefile pinball_frontend.py
      - run: pyinstaller --onefile table_manager.py
      - uses: actions/upload-artifact@v3
        with:
          name: exe-files
          path: dist/
```
