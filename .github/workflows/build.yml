# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 Pillow pyinstaller
    - name: Build exe files
      run: |
        pyinstaller --onefile pinball_frontend.py
    - name: Create distributable bundle
      run: python package_bundle.py
    - name: Upload bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: pinball-cabinet-bundle
        path: dist/pinball-cabinet-bundle.zip
